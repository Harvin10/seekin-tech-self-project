<html lang="id">

  <meta name="description" content="Matriks Eisenhower, daftar tugas dan kalender kamu.">
  <meta name="theme-color" content="#f3f5f6">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="stylesheet" href="/app.css">
  <script src="/boot.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>

      <symbol id="i-cal" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>

      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>

  <div id="app"><div class="boot t-subhead">Membuka papan…</div></div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel" id="sheet-panel">
      <div class="sheet-grab" id="sheet-grab"><div class="handle" aria-hidden="true"></div><h2 id="sheet-title"></h2></div>
      <form id="sheet-form" class="sheet-form" novalidate>
        <div class="sheet-body" id="sheet-body"></div>
        <div class="sheet-foot" id="sheet-foot"></div>
      </form>
    </div>
  </dialog>

  <dialog class="modal" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <div class="modal-panel">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn text pressable" id="confirm-no">Batal</button>
        <button type="button" class="btn danger pressable" id="confirm-yes">Hapus</button>
      </div>
    </div>
  </dialog>

  <dialog class="modal" id="when" aria-labelledby="when-title" aria-describedby="when-text">
    <form class="modal-panel" id="when-form" novalidate>
      <h2 id="when-title">Jam berapa?</h2>
      <p id="when-text"></p>
      <div><label class="label" for="when-time">Jam</label><input class="field num" type="time" id="when-time"></div>
      <div class="modal-actions">
        <button type="button" class="btn text pressable" id="when-skip">Tanpa jam</button>
        <button type="submit" class="btn filled pressable">Simpan</button>
      </div>
    </form>
  </dialog>

  <div class="snackbar-host" id="snackbar-host" role="status" aria-live="polite"></div>
</body>
</html>
